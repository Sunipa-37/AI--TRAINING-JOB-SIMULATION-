# Optional: spins up just PostgreSQL for local development.
# Run:  docker compose up -d
# Then point server/.env DATABASE_URL at localhost:5432 (see server/.env.example).
version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trainly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
